name: "M1S YouTube Cast Receiver"
version: "1.0.2"
slug: "m1s_youtube_cast_receiver"
description: >-
  YouTube / YouTube Music continuous-stream receiver for Aqara M1S individual
  media players and M1S Media Group. One HA transport stays open across tracks.
arch:
  - amd64
startup: application
boot: auto
url: "https://github.com/caiuspoputa-debug/m1s-youtube-cast-receiver"
init: false
host_network: true
homeassistant_api: true
options:
  target_entity: "media_player.m1s_media_group"
  device_name: "Aqara M1S Group"
  audio_port: 8098
  dial_port: 8099
  stream_host: ""
  enable_tv_code: true
  include_individual: true
  individual_match: "aqara_m1s_zigbee_router"
  max_receivers: 16
  resume_interrupted_stream: false
  resume_interrupted_delay_ms: 300
  auto_remove_individual_from_group: true
  auto_restore_individual_to_group: true
  auto_remove_group_delay_ms: 300
  log_level: "info"
schema:
  target_entity: str
  device_name: str
  audio_port: port
  dial_port: port
  stream_host: str
  enable_tv_code: bool
  include_individual: bool
  individual_match: str
  max_receivers: int
  resume_interrupted_stream: bool
  resume_interrupted_delay_ms: int
  auto_remove_individual_from_group: bool
  auto_restore_individual_to_group: bool
  auto_remove_group_delay_ms: int
  log_level: "list(error|warn|info|debug)"
